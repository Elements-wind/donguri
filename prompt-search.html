<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>プロンプト単語検索</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="単語検索">
<meta name="theme-color" content="#cde5e2">

<style>
  :root{
    --ink: #1a1d1a;
    --paper: #cde5e2;
    --panel: #ffffff;
    --line: #dedad0;
    --accent: #2f5d46;
    --accent-soft: #e4ede7;
    --warn: #a3432c;
  }
  *{box-sizing:border-box;}
  html{background:var(--paper);}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    -webkit-tap-highlight-color:transparent;
    min-height:100vh;
    min-height:100dvh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }
  .wrap{
    max-width:640px;
    margin:0 auto;
    padding:16px 14px 100px;
  }
  header{
    padding:4px 2px 14px;
    border-bottom:1px solid rgba(26,29,26,0.12);
    margin-bottom:14px;
  }
  h1{
    font-size:19px;
    font-weight:700;
    margin:0 0 4px;
  }
  .sub{
    font-size:12.5px;
    color:#3f4a45;
    line-height:1.5;
    margin:0;
  }

  /* view tabs */
  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .tabs button{
    flex:1;
    padding:10px 8px;
    border-radius:9px;
    border:1px solid rgba(26,29,26,0.15);
    background:var(--panel);
    color:#3f4a45;
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .tabs button.on{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  .tab-badge{
    display:inline-block;
    min-width:18px;
    padding:1px 5px;
    border-radius:999px;
    background:rgba(26,29,26,0.1);
    color:#3f4a45;
    font-size:10.5px;
    font-weight:700;
    vertical-align:middle;
  }
  .tabs button.on .tab-badge{
    background:rgba(255,255,255,0.28);
    color:#fff;
  }

  .view{display:none;}
  .view.active{display:block;}

  /* search box */
  .search-box{
    position:relative;
    margin-bottom:12px;
  }
  #queryInput{
    width:100%;
    padding:12px 14px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--panel);
    font-size:15px;
    color:var(--ink);
  }
  #queryInput:focus{outline:2px solid var(--accent); outline-offset:1px;}

  .chip-row{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-bottom:14px;
  }
  .chip{
    padding:6px 12px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--panel);
    color:#3f4a45;
    font-size:12.5px;
    cursor:pointer;
  }
  .chip.on{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }

  /* result cards */
  .pinned-section{
    margin-bottom:16px;
    padding:12px;
    border:1px solid rgba(47,93,70,0.25);
    border-radius:10px;
    background:rgba(255,255,255,0.35);
  }
  .pinned-heading{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:8px;
  }
  .pinned-heading h2{font-size:13px; margin:0;}
  #pinnedCount{font-size:12px; color:var(--accent); font-weight:600;}
  #pinnedEmpty{font-size:12px; line-height:1.6; color:#63665f; margin:0;}
  #pinnedList{display:flex; flex-direction:column; gap:8px;}
  .result-heading{display:flex; align-items:flex-start; gap:8px;}
  .result-heading .result-phrase{flex:1; min-width:0;}
  .result-pin{
    display:flex;
    align-items:center;
    justify-content:center;
    flex:none;
    width:44px;
    min-height:44px;
    padding:8px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel);
    color:#63665f;
    cursor:pointer;
  }
  .result-pin[aria-pressed="true"]{
    color:var(--accent);
    background:var(--accent-soft);
    border-color:var(--accent);
  }
  .result-pin:disabled{opacity:0.35; cursor:default;}
  .result-pin:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .result-pin svg{width:20px; height:20px; pointer-events:none;}
  #resultsList{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .result-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    display:flex;
    gap:10px;
    align-items:flex-start;
    cursor:pointer;
  }
  .result-card.picked{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  .result-check{
    width:20px;height:20px;
    border-radius:6px;
    border:2px solid var(--line);
    flex:none;
    margin-top:1px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    color:#fff;
  }
  .result-card.picked .result-check{
    background:var(--accent);
    border-color:var(--accent);
  }
  .result-body{flex:1; min-width:0;}
  .result-phrase{
    font-size:13.5px;
    line-height:1.5;
    color:var(--ink);
    word-break:break-word;
  }
  .result-translation{
    font-size:11.5px;
    line-height:1.4;
    color:#63665f;
    margin-top:2px;
  }
  .result-description{
    font-size:11px;
    line-height:1.5;
    color:#7a7d73;
    font-style:italic;
    margin-top:5px;
    padding-left:8px;
    border-left:2px solid rgba(47,93,70,0.35);
  }
  .result-tags{
    margin-top:5px;
    display:flex;
    flex-wrap:wrap;
    gap:5px;
  }
  .result-tag{
    font-size:10.5px;
    color:#3f4a45;
    background:rgba(26,29,26,0.06);
    border-radius:5px;
    padding:2px 6px;
  }
  #emptyState{
    text-align:center;
    color:#63665f;
    font-size:13px;
    padding:30px 10px;
  }

  /* sticky selected-prompt bar */
  #selectedBar{
    position:fixed;
    left:0; right:0; bottom:0;
    background:var(--panel);
    border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    display:none;
    z-index:50;
  }
  #selectedBar.show{display:block;}
  #selectedPreview{
    font-size:12px;
    color:#3f4a45;
    line-height:1.5;
    max-height:90px;
    overflow-y:auto;
    margin-bottom:8px;
    padding:8px 10px;
    background:var(--paper);
    border-radius:8px;
  }
  .preview-line{
    padding:2px 0;
  }
  .preview-ja{
    color:#7a7d73;
  }
  .selected-actions{
    display:flex;
    gap:8px;
  }

  /* buttons */
  .btn{
    padding:11px 10px;
    border-radius:9px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--ink);
    font-size:13.5px;
    font-weight:600;
    cursor:pointer;
  }
  .btn.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
    flex:1;
  }
  .btn.ghost{
    color:#63665f;
    font-weight:500;
  }
  .btn:disabled{opacity:0.4; cursor:default;}
  .btn:active{transform:scale(0.98);}

  /* manage view */
  .form-block{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:14px;
    margin-bottom:14px;
  }
  .form-block h2{
    font-size:14px;
    margin:0 0 10px;
  }
  .form-row{margin-bottom:10px;}
  .form-row:last-child{margin-bottom:0;}
  .form-row label{
    display:block;
    font-size:11.5px;
    color:#63665f;
    margin-bottom:5px;
  }
  .form-row textarea,
  .form-row input[type="text"]{
    width:100%;
    padding:9px 11px;
    border-radius:8px;
    border:1px solid var(--line);
    font-size:13.5px;
    font-family:inherit;
    background:#fdfdfb;
    color:var(--ink);
  }
  .form-row textarea{resize:vertical; min-height:56px;}
  .form-hint{font-size:11px; color:#8a8d84; margin-top:4px;}

  .manage-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .manage-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
  }
  .manage-phrase{
    font-size:13px;
    line-height:1.5;
    margin-bottom:6px;
  }
  .manage-tag-input{
    width:100%;
    padding:6px 9px;
    border-radius:7px;
    border:1px solid var(--line);
    font-size:12px;
    margin-bottom:8px;
    background:#fdfdfb;
  }
  textarea.manage-tag-input{
    font-family:inherit;
    resize:vertical;
    min-height:32px;
  }
  .manage-row-actions{
    display:flex;
    gap:8px;
  }
  .manage-row-actions .btn{
    flex:1;
    padding:7px 6px;
    font-size:12px;
  }

  #toast{
    position:fixed;
    left:50%;
    bottom:90px;
    transform:translateX(-50%) translateY(12px);
    background:var(--ink);
    color:#fff;
    font-size:13px;
    padding:9px 16px;
    border-radius:20px;
    opacity:0;
    pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
    max-width:88%;
    text-align:center;
    z-index:100;
  }
  #toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>プロンプト単語検索</h1>
    <p class="sub">出したい効果からAIイラスト用の英語プロンプトを探して、まとめてコピーできます。</p>
  </header>

  <div class="tabs">
    <button class="on" data-tab="search">検索</button>
    <button data-tab="manage">登録・管理 <span class="tab-badge" id="tabBadge">0</span></button>
  </div>

  <!-- 検索ビュー -->
  <div class="view active" id="view-search">
    <section class="pinned-section" aria-labelledby="pinnedHeading">
      <div class="pinned-heading">
        <h2 id="pinnedHeading">ピン留め</h2>
        <span id="pinnedCount" aria-live="polite">0 / 10</span>
      </div>
      <p id="pinnedEmpty">よく使うフレーズのピンを押すと、ここに表示されます（最大10個）。</p>
      <div id="pinnedList"></div>
    </section>
    <div class="search-box">
      <input type="text" id="queryInput" placeholder="例：躍動感を出したい、光を印象的に">
    </div>
    <div class="chip-row" id="categoryChips"></div>
    <div id="resultsList"></div>
    <div id="emptyState" style="display:none;">条件に合う単語がまだ登録されていません。「登録・管理」から追加できます。</div>
  </div>

  <!-- 登録・管理ビュー -->
  <div class="view" id="view-manage">
    <div class="form-block">
      <h2>1件ずつ追加</h2>
      <div class="form-row">
        <label>英語フレーズ（1つだけ）</label>
        <textarea id="addPhrase" placeholder="例：dynamic camera angle"></textarea>
      </div>
      <div class="form-row">
        <label>日本語訳（任意）</label>
        <textarea id="addTranslation" placeholder="例：ダイナミックなカメラアングル" style="min-height:40px;"></textarea>
      </div>
      <div class="form-row">
        <label>意味の説明・メモ（任意・長文OK）</label>
        <textarea id="addDescription" placeholder="例：映画のワンシーンのような角度" style="min-height:60px;"></textarea>
      </div>
      <div class="form-row">
        <label>カテゴリ（カンマ区切り、複数OK）</label>
        <input type="text" id="addTags" placeholder="例：構図, カメラ">
      </div>
      <button class="btn primary" id="addOneBtn" style="width:100%;">追加する</button>
    </div>

    <div class="form-block">
      <h2>まとめて追加（1行＝1件）</h2>
      <div class="form-row">
        <textarea id="bulkPhrase" placeholder="1行に1フレーズずつ貼り付け" style="min-height:90px;"></textarea>
        <p class="form-hint">カテゴリは未設定で登録されます。下の一覧から後でタグ付けできます。</p>
      </div>
      <button class="btn primary" id="addBulkBtn" style="width:100%;">まとめて追加する</button>
    </div>

    <div class="form-block">
      <h2>バックアップ</h2>
      <div class="selected-actions">
        <button class="btn ghost" id="exportBtn" style="flex:1;">書き出す</button>
        <button class="btn ghost" id="importBtn" style="flex:1;">読み込む</button>
      </div>
      <p class="form-hint">機種変更やブラウザが変わる前に「書き出す」でバックアップしておくと安心です。</p>
    </div>

    <h2 style="font-size:14px; margin:4px 0 10px;">登録済み一覧（<span id="totalCount">0</span>件）</h2>
    <div class="manage-list" id="manageList"></div>
  </div>
</div>

<div id="selectedBar">
  <div id="selectedPreview"></div>
  <div class="selected-actions">
    <button class="btn primary" id="copyEnBtn">英語をコピー</button>
    <button class="btn ghost" id="copyJaBtn">日本語をコピー</button>
  </div>
  <button class="btn ghost" id="clearSelectedBtn" style="width:100%; margin-top:8px;">選択解除</button>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const STORAGE_KEY = 'promptWordEntries_v1';
  const MAX_PINS = 10;

  const queryInput = document.getElementById('queryInput');
  const pinnedList = document.getElementById('pinnedList');
  const pinnedCount = document.getElementById('pinnedCount');
  const pinnedEmpty = document.getElementById('pinnedEmpty');
  const categoryChips = document.getElementById('categoryChips');
  const resultsList = document.getElementById('resultsList');
  const emptyState = document.getElementById('emptyState');
  const manageList = document.getElementById('manageList');
  const totalCount = document.getElementById('totalCount');
  const tabBadge = document.getElementById('tabBadge');
  const selectedBar = document.getElementById('selectedBar');
  const selectedPreview = document.getElementById('selectedPreview');
  const copyEnBtn = document.getElementById('copyEnBtn');
  const copyJaBtn = document.getElementById('copyJaBtn');
  const clearSelectedBtn = document.getElementById('clearSelectedBtn');
  const addPhrase = document.getElementById('addPhrase');
  const addTranslation = document.getElementById('addTranslation');
  const addDescription = document.getElementById('addDescription');
  const addTags = document.getElementById('addTags');
  const addOneBtn = document.getElementById('addOneBtn');
  const bulkPhrase = document.getElementById('bulkPhrase');
  const addBulkBtn = document.getElementById('addBulkBtn');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const toast = document.getElementById('toast');

  let entries = [];
  let activeCategory = null; // null = すべて
  let selectedIds = new Set();
  let toastTimer = null;

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'), 2000);
  }

  function uid(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  // ---------- persistence ----------
  const SEED_VERSION = 33; // bump when the baseline entry set changes below
  const SEED_VERSION_KEY = 'promptWordSeedVersion_v1';

  // Keep all stored and imported wording aligned with the male character setting.
  function masculineText(text){
    const words = {her:'him', she:'he', hers:'his', herself:'himself', female:'male', girl:'man', girls:'men', woman:'man', women:'men', lady:'man', ladies:'men', feminine:'masculine', goddess:'god', princess:'prince', queen:'king'};
    text = text.replace(/\bher\b(?=\s+(?:body|hair|face|eyes|dress|outline|silhouette|wings|hands|clothes|clothing|head|skin|voice|arms|legs|back|shoulders)\b)/gi, match=>match[0]==='H' ? 'His' : 'his');
    text = text.replace(/\b(?:her|she|hers|herself|female|girl|girls|woman|women|lady|ladies|feminine|goddess|princess|queen)\b/gi, match=>{
      const value = words[match.toLowerCase()];
      return match[0]===match[0].toUpperCase() ? value[0].toUpperCase()+value.slice(1) : value;
    });
    const japanese = [['彼女','彼'],['女性','男性'],['少女','青年'],['女の子','男の子'],['女神','男神'],['女王','王'],['王女','王子']];
    japanese.forEach(([from,to])=>{ text=text.split(from).join(to); });
    return text;
  }

  function normalizeGenderEntries(){
    entries.forEach(entry=>{
      ['phrase','translation','description','keywords'].forEach(field=>{
        if(typeof entry[field] === 'string') entry[field] = masculineText(entry[field]);
      });
    });
  }

  function loadEntries(){
    let raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ /* ignore */ }
    entries = raw ? JSON.parse(raw) : [];
    normalizeGenderEntries();

    let storedVersion = 0;
    try{ storedVersion = parseInt(localStorage.getItem(SEED_VERSION_KEY) || '0', 10); }catch(e){ /* ignore */ }

    if(storedVersion < SEED_VERSION){
      // Merge the complete backup; preserve separate duplicate entries and local edits.
      const previousDefaults = {"mu56kq1eesry25": {"description": "目、鼻、唇など顔の各部分を精細に描く。元の顔立ちを維持したい場合は造形の保持も指定する。", "keywords": "", "categories": ["画質"]}, "mu56kq1ezxctfg": {"description": "織り目、刺繍、革のしわなど衣服の素材を緻密に描く。布の種類や対象部位を添える。", "keywords": "", "categories": ["画質"]}, "mu56kq1eedbx3x": {"description": "霧や埃を通る光の筋に厚みを持たせ、空間の深さを見せる。", "keywords": "", "categories": ["ライティング"]}, "mu56kq1e5dyrt7": {"description": "霧や埃を通る光の筋に厚みを持たせ、空間の深さを見せる。", "keywords": "", "categories": ["ライティング"]}, "mu56kq1em567nr": {"description": "明暗や色の対比を強く調整し、画面の印象を際立たせる。暖色と寒色など狙う配色を添える。", "keywords": "", "categories": ["色彩"]}, "mu56kq1e9x7btc": {"description": "光が物体の表面から内部へ入り、散乱して外へ出る質感。肌、ろう、薄い葉などの柔らかな透過光に使う。", "keywords": "", "categories": ["画質"]}, "mu56kq1epsa897": {"description": "光の経路を計算したような自然な反射を求める指定。画像生成の文章指定だけで実際の描画方式が決まるわけではない。", "keywords": "", "categories": ["画質", "光"]}, "mu56kq1eyz51ik": {"description": "細く丁寧な筆の跡を使う。髪や布などの表面へ繊細な描き込みを加える絵画的な表現。", "keywords": "", "categories": ["スタイル"]}};
      const seeds = defaultSeed();
      const matched = new Set();
      seeds.forEach(seed => {
        let current = entries.find(e => !matched.has(e) && e.id === seed.id);
        if(!current) current = entries.find(e => !matched.has(e) && e.phrase === seed.phrase);
        if(current){
          const previous = previousDefaults[seed.id];
          if(previous){
            ['description', 'keywords', 'categories'].forEach(field => {
              if(JSON.stringify(current[field]) === JSON.stringify(previous[field])) current[field] = seed[field];
            });
          }
          if(!String(current.description || '').trim()) current.description = seed.description;
          matched.add(current);
        } else {
          entries.push(seed);
          matched.add(seed);
        }
      });
      try{ localStorage.setItem(SEED_VERSION_KEY, String(SEED_VERSION)); }catch(e){ /* ignore */ }
      saveEntries();
    } else if(raw === null){
      saveEntries();
    }
  }
  function saveEntries(){
    normalizeGenderEntries();
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
      return true;
    }catch(e){
      showToast('保存に失敗しました（ストレージの空き容量を確認してください）');
      return false;
    }
  }

  // Pin state belongs to each entry so existing JSON backups include it.
  function normalizePins(){
    let count = 0;
    entries.forEach(entry=>{
      entry.pinned = entry.pinned === true && count < MAX_PINS;
      if(entry.pinned) count++;
    });
  }

  function togglePin(entry, sourceList){
    if(!entry.pinned && entries.filter(e=>e.pinned).length >= MAX_PINS){
      showToast('ピン留めは最大10個です。先に1個外してください');
      return;
    }
    const previous = entry.pinned;
    entry.pinned = !previous;
    if(!saveEntries()){
      entry.pinned = previous;
      return;
    }
    renderResults();
    showToast(entry.pinned ? 'ピン留めしました' : 'ピン留めを外しました');
    // Keep keyboard focus on the action after cards are rebuilt.
    const card = Array.from(sourceList.children).find(c=>c.dataset.entryId === entry.id)
      || Array.from(resultsList.children).find(c=>c.dataset.entryId === entry.id);
    if(card) card.querySelector('.result-pin').focus({preventScroll:true});
    else queryInput.focus({preventScroll:true});
  }

  function defaultSeed(){

  // ---------- tabs ----------
  document.querySelectorAll('.tabs button').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      const tab = btn.dataset.tab;
      document.getElementById('view-search').classList.toggle('active', tab==='search');
      document.getElementById('view-manage').classList.toggle('active', tab==='manage');
      if(tab === 'manage') renderManageList();
    });
  });

  // ---------- category chips ----------
  function allCategories(){
    const set = new Set();
    entries.forEach(e => (e.categories||[]).forEach(c => set.add(c)));
    return Array.from(set).sort();
  }

  function renderChips(){
    const cats = allCategories();
    categoryChips.innerHTML = '';
    const allChip = document.createElement('button');
    allChip.className = 'chip' + (activeCategory === null ? ' on' : '');
    allChip.textContent = 'すべて';
    allChip.addEventListener('click', ()=>{ activeCategory = null; renderChips(); renderResults(); });
    categoryChips.appendChild(allChip);

    cats.forEach(cat=>{
      const chip = document.createElement('button');
      chip.className = 'chip' + (activeCategory === cat ? ' on' : '');
      chip.textContent = cat;
      chip.addEventListener('click', ()=>{
        activeCategory = (activeCategory === cat) ? null : cat;
        renderChips();
        renderResults();
      });
      categoryChips.appendChild(chip);
    });
  }

  // ---------- search + results ----------
  function matchesQuery(entry, q){
    if(!q) return true;
    const hay = (entry.categories||[]).join(' ') + ' ' + (entry.keywords||'') + ' ' + entry.phrase + ' ' + (entry.translation||'') + ' ' + (entry.description||'');
    const hayLower = hay.toLowerCase();
    // split on spaces/commas, match if ANY token is found
    const tokens = q.toLowerCase().split(/[\s,、]+/).filter(Boolean);
    return tokens.some(t => hayLower.includes(t));
  }

  function renderResults(){
    const q = queryInput.value.trim();
    const filtered = entries.filter(e=>{
      const catOk = !activeCategory || (e.categories||[]).includes(activeCategory);
      return catOk && matchesQuery(e, q);
    });

    resultsList.innerHTML = '';
    emptyState.style.display = filtered.length ? 'none' : 'block';

    const pins = entries.filter(e=>e.pinned);
    pinnedList.innerHTML = '';
    pinnedCount.textContent = pins.length + ' / ' + MAX_PINS;
    pinnedEmpty.style.display = pins.length ? 'none' : 'block';
    pins.forEach(entry=>pinnedList.appendChild(createResultCard(entry, pinnedList, pins.length)));
    filtered.forEach(entry=>resultsList.appendChild(createResultCard(entry, resultsList, pins.length)));
  }

  function createResultCard(entry, sourceList, pinCount){
    const card = document.createElement('div');
    card.className = 'result-card' + (selectedIds.has(entry.id) ? ' picked' : '');
    card.dataset.entryId = entry.id;
    card.innerHTML = `
      <div class="result-check">${selectedIds.has(entry.id) ? '✓' : ''}</div>
      <div class="result-body">
        <div class="result-heading">
          <div class="result-phrase">${escapeHtml(entry.phrase)}</div>
          <button type="button" class="result-pin" aria-pressed="${!!entry.pinned}"
            aria-label="${entry.pinned ? 'ピン留めを外す' : 'ピン留めする'}：${escapeHtml(entry.phrase)}"
            title="${entry.pinned ? 'ピン留めを外す' : pinCount >= MAX_PINS ? '最大10個です。先に1個外してください' : 'ピン留めする'}"
            ${!entry.pinned && pinCount >= MAX_PINS ? 'disabled' : ''}>
            <svg viewBox="0 0 24 24" fill="${entry.pinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
              <path d="M8 3h8M9 3v6l-3 4v2h12v-2l-3-4V3M12 15v6" />
            </svg>
          </button>
        </div>
        ${entry.translation ? `<div class="result-translation">${escapeHtml(entry.translation)}</div>` : ''}
        ${entry.description ? `<div class="result-description">${escapeHtml(entry.description)}</div>` : ''}
        <div class="result-tags">${(entry.categories||[]).map(c=>`<span class="result-tag">${escapeHtml(c)}</span>`).join('')}</div>
      </div>
    `;
    card.querySelector('.result-pin').addEventListener('click', event=>{
      event.stopPropagation();
      togglePin(entry, sourceList);
    });
    card.addEventListener('click', event=>{
      // A disabled pin must not accidentally select the surrounding card.
      if(event.target.closest('.result-pin')) return;
      if(selectedIds.has(entry.id)) selectedIds.delete(entry.id);
      else selectedIds.add(entry.id);
      renderResults();
      renderSelectedBar();
    });
    return card;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  queryInput.addEventListener('input', renderResults);

  // ---------- selected bar ----------
  function renderSelectedBar(){
    if(selectedIds.size === 0){
      selectedBar.classList.remove('show');
      return;
    }
    selectedBar.classList.add('show');
    const picked = entries.filter(e => selectedIds.has(e.id));
    selectedPreview.innerHTML = picked.map(e=>{
      const en = escapeHtml(e.phrase);
      const ja = e.translation ? `<span class="preview-ja"> — ${escapeHtml(e.translation)}</span>` : '';
      return `<div class="preview-line">${en}${ja}</div>`;
    }).join('');
  }

  function copyText(text, emptyMsg){
    if(!text){ showToast(emptyMsg); return; }
    navigator.clipboard.writeText(text).then(()=>{
      showToast('コピーしました');
    }).catch(()=>{
      // fallback for contexts where clipboard API is blocked
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try{ document.execCommand('copy'); showToast('コピーしました'); }
      catch(e){ showToast('コピーできませんでした'); }
      ta.remove();
    });
  }

  copyEnBtn.addEventListener('click', ()=>{
    const phrases = entries.filter(e => selectedIds.has(e.id)).map(e => e.phrase);
    copyText(phrases.join(', '), 'コピーする内容がありません');
  });
  copyJaBtn.addEventListener('click', ()=>{
    const picked = entries.filter(e => selectedIds.has(e.id));
    const translations = picked.map(e => e.translation).filter(Boolean);
    if(translations.length === 0){
      showToast('選択した項目に日本語訳がありません');
      return;
    }
    copyText(translations.join('\n'), 'コピーする内容がありません');
  });
  clearSelectedBtn.addEventListener('click', ()=>{
    selectedIds.clear();
    renderResults();
    renderSelectedBar();
  });

  // ---------- add single ----------
  addOneBtn.addEventListener('click', ()=>{
    const phrase = addPhrase.value.trim();
    if(!phrase){ showToast('フレーズを入力してください'); return; }
    const translation = addTranslation.value.trim();
    const description = addDescription.value.trim();
    const categories = addTags.value.split(/[,、]+/).map(s=>s.trim()).filter(Boolean);
    entries.push({ id: uid(), phrase, translation, description, categories, keywords: '' });
    saveEntries();
    addPhrase.value = '';
    addTranslation.value = '';
    addDescription.value = '';
    addTags.value = '';
    showToast('追加しました');
    renderChips();
    renderResults();
    renderManageList();
  });

  // ---------- bulk add ----------
  addBulkBtn.addEventListener('click', ()=>{
    const lines = bulkPhrase.value.split('\n').map(s=>s.trim()).filter(Boolean);
    if(lines.length === 0){ showToast('フレーズを入力してください'); return; }
    lines.forEach(line=>{
      entries.push({ id: uid(), phrase: line, categories: [], keywords: '' });
    });
    saveEntries();
    bulkPhrase.value = '';
    showToast(lines.length + '件追加しました');
    renderChips();
    renderResults();
    renderManageList();
  });

  // ---------- manage list ----------
  function renderManageList(){
    totalCount.textContent = entries.length;
    tabBadge.textContent = entries.length;
    manageList.innerHTML = '';
    // newest first
    const ordered = entries.slice().reverse();
    ordered.forEach(entry=>{
      const card = document.createElement('div');
      card.className = 'manage-card';
      const tagStr = (entry.categories||[]).join(', ');
      card.innerHTML = `
        <div class="manage-phrase">${escapeHtml(entry.phrase)}</div>
        <textarea class="manage-tag-input" data-field="translation" placeholder="日本語訳（任意）">${escapeHtml(entry.translation||'')}</textarea>
        <textarea class="manage-tag-input" data-field="description" placeholder="意味の説明・メモ（任意・長文OK）">${escapeHtml(entry.description||'')}</textarea>
        <input type="text" class="manage-tag-input" data-field="categories" value="${escapeHtml(tagStr)}" placeholder="カテゴリ（カンマ区切り）">
        <div class="manage-row-actions">
          <button class="btn ghost save-tag-btn">保存</button>
          <button class="btn ghost delete-entry-btn">削除</button>
        </div>
      `;
      const translationInput = card.querySelector('[data-field="translation"]');
      const descriptionInput = card.querySelector('[data-field="description"]');
      const tagInput = card.querySelector('[data-field="categories"]');
      card.querySelector('.save-tag-btn').addEventListener('click', ()=>{
        entry.translation = translationInput.value.trim();
        entry.description = descriptionInput.value.trim();
        entry.categories = tagInput.value.split(/[,、]+/).map(s=>s.trim()).filter(Boolean);
        saveEntries();
        showToast('更新しました');
        renderChips();
        renderResults();
      });
      card.querySelector('.delete-entry-btn').addEventListener('click', ()=>{
        entries = entries.filter(e => e.id !== entry.id);
        selectedIds.delete(entry.id);
        saveEntries();
        renderChips();
        renderResults();
        renderSelectedBar();
        renderManageList();
      });
      manageList.appendChild(card);
    });
  }

  // ---------- export / import ----------
  exportBtn.addEventListener('click', ()=>{
    const text = JSON.stringify(entries, null, 2);
    navigator.clipboard.writeText(text).then(()=>{
      showToast('データをコピーしました。メモ等に貼って保存してください');
    }).catch(()=>{
      showToast('コピーできませんでした');
    });
  });
  importBtn.addEventListener('click', ()=>{
    const text = prompt('書き出したJSONデータを貼り付けてください（既存のデータは置き換わります）');
    if(!text) return;
    try{
      const parsed = JSON.parse(text);
      if(!Array.isArray(parsed)) throw new Error('not an array');
      entries = parsed.map(e=>({
        id: e.id || uid(),
        phrase: e.phrase || '',
        translation: e.translation || '',
        description: e.description || '',
        categories: Array.isArray(e.categories) ? e.categories : [],
        keywords: e.keywords || '',
        seeded: !!e.seeded,
        pinned: e.pinned === true
      }));
      const importedPinCount = entries.filter(e=>e.pinned).length;
      normalizePins();
      selectedIds.clear();
      saveEntries();
      renderSelectedBar();
      showToast(importedPinCount > MAX_PINS ? '読み込みました（ピン留めは先頭10個を復元）' : '読み込みました');
      renderChips();
      renderResults();
      renderManageList();
    }catch(e){
      showToast('データの形式が正しくありません');
    }
  });

  // ---------- init ----------
  loadEntries();
  normalizePins();
  renderChips();
  renderResults();
  renderManageList();
})();
</script>
</body>
</html>
